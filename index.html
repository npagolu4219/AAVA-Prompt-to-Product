<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08121c" />
    <script>
      // Apply the colour mode before first paint so dark mode never flashes light while the app loads.
      // Mirrors ThemeProvider: stored setting (aava-p2p.theme.v1) → default 'dark'.
      ;(function () {
        var mode = 'dark'
        try {
          var saved = JSON.parse(localStorage.getItem('aava-p2p.theme.v1') || '{}')
          if (saved.mode) mode = saved.mode
        } catch (e) {}
        if (mode === 'system') mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = mode
      })()
    </script>
    <meta name="description" content="AAVA Prompt-to-Product — turn a prompt or Figma frame into verified, design-system compliant UI." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>AAVA Prompt-to-Product</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
